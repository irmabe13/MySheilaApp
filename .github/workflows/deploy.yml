name: CI/CD - My Sheila

on:
  push:
    branches: [ "prod" ]

jobs:
  build_app:
    name: 1) Build application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew assemble --no-daemon

  run_tests:
    name: 2) Run tests
    runs-on: ubuntu-latest
    needs: build_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test
        run: ./gradlew test --no-daemon

  docker_build_push:
    name: 3) Docker build & push
    runs-on: ubuntu-latest
    needs: run_tests
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      BACKEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USER }}/mysheila-app
      FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USER }}/mysheila-frontend
      TAG: prod-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Backend image (Dockerfile à la racine)
      - name: Build backend image
        run: |
          docker build -f Dockerfile -t $BACKEND_IMAGE:${TAG} -t $BACKEND_IMAGE:latest .
      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:${TAG}
          docker push $BACKEND_IMAGE:latest

      # Frontend image (Dockerfile dans frontend/)
      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile -t $FRONTEND_IMAGE:${TAG} -t $FRONTEND_IMAGE:latest ./frontend
      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:${TAG}
          docker push $FRONTEND_IMAGE:latest

  deploy_to_server:
    name: 4) Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker_build_push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            cd /opt/mysheila
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            docker image prune -f