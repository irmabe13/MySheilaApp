services:

  database:
    image: mysql:8.0
    container_name: mysheila_db
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=mysheiladb
      - TZ=Europe/Paris
    restart: always
    ports:
      - '3306:3306'
    volumes:
      - db_data_production:/var/lib/mysql

volumes:
  db_data_production: