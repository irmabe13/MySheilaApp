services:

  app:

    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysheila
    restart: unless-stopped
    environment:
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_URL

    env_file:
      - .env

    ports:
      - '8080:${SERVER_PORT:-8080}'
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: mysheila_db
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=mysheiladb
      - TZ=Europe/Paris
    restart: always
    ports:
      - '3306:3306'
    volumes:
      - db_data_production:/var/lib/mysql

volumes:
  db_data_production: